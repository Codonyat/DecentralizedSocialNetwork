[workspace]
members = [
    "crates/core",
    "crates/data",
    "crates/token-y",
    "crates/token-r",
    "crates/invitation",
    "crates/moderation",
    "crates/indexer",
    "crates/cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# Internal crates
dsn-core = { path = "crates/core" }
dsn-data = { path = "crates/data" }
dsn-token-y = { path = "crates/token-y" }
dsn-token-r = { path = "crates/token-r" }
dsn-invitation = { path = "crates/invitation" }
dsn-moderation = { path = "crates/moderation" }
dsn-indexer = { path = "crates/indexer" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"

# Crypto
sha2 = "0.10"
blake3 = "1"

# Async
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Error handling
thiserror = "2"
anyhow = "1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Web/Indexer
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
reqwest = { version = "0.12", features = ["json"] }

# Autonomi (commented until we integrate with real network)
# autonomi = "0.3.6"

# Testing
rand = "0.9"
